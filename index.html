<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Learning">

<title>Home Learning Phonics</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f7fa;
    color: #1e293b;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.header {
    background: white;
    border-radius: 22px;
    padding: 30px;
    margin-bottom: 22px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}

.header-label {
    color: #0369a1;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
}

h1 {
    font-size: 38px;
    margin: 8px 0 10px;
}

.subtitle {
    color: #64748b;
    font-size: 18px;
    line-height: 1.5;
}

.apple-tv {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    padding: 15px;
    border-radius: 14px;
    margin-top: 20px;
    line-height: 1.5;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.tab {
    border: none;
    padding: 17px 10px;
    border-radius: 15px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.set1-tab { background: #0284c7; }
.set2-tab { background: #059669; }
.set3-tab { background: #7c3aed; }

.section {
    display: none;
}

.section.active {
    display: block;
}

.section-title {
    font-size: 28px;
    margin: 25px 0 5px;
}

.section-description {
    color: #64748b;
    margin-bottom: 18px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    padding: 18px;
    text-decoration: none;
    color: #1e293b;
    display: flex;
    align-items: center;
    gap: 15px;
    min-height: 125px;
    transition: 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.10);
}

.sound {
    min-width: 65px;
    height: 65px;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    font-size: 24px;
}

.set1 .sound { background: #0284c7; }
.set2 .sound { background: #059669; }
.set3 .sound { background: #7c3aed; }

.card-title {
    font-weight: bold;
    font-size: 18px;
}

.rhyme {
    color: #64748b;
    margin-top: 4px;
    line-height: 1.3;
    font-size: 14px;
}

.watch {
    color: #0369a1;
    font-weight: bold;
    margin-top: 8px;
}

footer {
    text-align: center;
    padding: 35px 10px;
    color: #64748b;
}

@media(max-width: 800px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 550px) {
    .container {
        padding: 12px;
    }

    .header {
        padding: 22px;
    }

    h1 {
        font-size: 30px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .tab {
        font-size: 16px;
        padding: 14px 6px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <div class="header-label">HOME LEARNING</div>
    <h1>📚 Phonics Video Library</h1>

    <div class="subtitle">
        Choose Set 1, Set 2 or Set 3 and then select the sound
        to open the home-learning video.
    </div>

    <div class="apple-tv">
        <strong>📺 Apple TV:</strong>
        Open a video on your iPhone or iPad.
        Then open Control Centre → Screen Mirroring → select your Apple TV.
    </div>
</div>

<div class="tabs">
    <button class="tab set1-tab" onclick="showSet('set1')">Set 1</button>
    <button class="tab set2-tab" onclick="showSet('set2')">Set 2</button>
    <button class="tab set3-tab" onclick="showSet('set3')">Set 3</button>
</div>

<div id="set1" class="section active set1">

<h2
